name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: anajao_ecommerce_test
          MARIADB_USER: anajao_test
          MARIADB_PASSWORD: anajao_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://anajao_test:anajao_test_password@127.0.0.1:3306/anajao_ecommerce_test?connection_limit=5&pool_timeout=10
      TEST_DATABASE_URL: mysql://anajao_test:anajao_test_password@127.0.0.1:3306/anajao_ecommerce_test?connection_limit=5&pool_timeout=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy migrations
        run: npm run db:deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Validate API artifacts
        run: npm run docs:validate

      - name: Built server smoke test
        run: npm run test:smoke

      - name: Dependency audit
        run: npm audit --audit-level=high
